<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" role="img" aria-labelledby="title desc">
  <title id="title">Data Analysis</title>
  <desc id="desc">Abstract dashboard cards, trend line, and data points.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102a43"/>
      <stop offset="52%" stop-color="#1d6f72"/>
      <stop offset="100%" stop-color="#f2b84b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#082032" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="640" height="384" rx="38" fill="url(#bg)"/>
  <circle cx="548" cy="72" r="96" fill="#ffffff" opacity=".12"/>
  <circle cx="90" cy="324" r="122" fill="#ffffff" opacity=".08"/>
  <g filter="url(#shadow)">
