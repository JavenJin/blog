    <rect x="112" y="112" width="118" height="74" rx="18" fill="#f7fafc" opacity=".9"/>
    <rect x="262" y="112" width="118" height="74" rx="18" fill="#f7fafc" opacity=".78"/>
    <rect x="412" y="112" width="76" height="74" rx="18" fill="#f7fafc" opacity=".68"/>
    <path d="M118 260 C174 214 214 234 262 196 C316 153 352 184 398 154 C444 123 482 138 528 106" fill="none" stroke="#ffd166" stroke-width="12" stroke-linecap="round"/>
    <path d="M118 260 C174 214 214 234 262 196 C316 153 352 184 398 154 C444 123 482 138 528 106" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".72"/>
    <g fill="#ffffff" stroke="#102a43" stroke-width="6">
      <circle cx="118" cy="260" r="12"/>
      <circle cx="262" cy="196" r="12"/>
      <circle cx="398" cy="154" r="12"/>
      <circle cx="528" cy="106" r="12"/>
    </g>
    <g fill="#102a43" opacity=".72">
      <rect x="132" y="134" width="58" height="8" rx="4"/>
      <rect x="132" y="154" width="78" height="8" rx="4"/>
      <rect x="282" y="134" width="58" height="8" rx="4"/>
      <rect x="282" y="154" width="78" height="8" rx="4"/>
      <rect x="432" y="134" width="38" height="8" rx="4"/>
      <rect x="432" y="154" width="28" height="8" rx="4"/>
